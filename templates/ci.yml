# CI-Geruest fuer supsign-Repos: die eigenen Jobs plus die beiden festen Jobs
# am Ende (ci, dependabot).
# Vorlage: https://github.com/supsign/.github/blob/main/templates/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Die eigentlichen Jobs des Repos (Tests, Lint, Build, ...).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "Tests, Lint, Build des Repos"

  # Einziger Required-Status-Check im Branch-Schutz. Er fasst alle Jobs
  # zusammen, damit der Branch-Schutz keine einzelnen Jobnamen kennen muss und
  # ein neuer Job ohne Settings-Aenderung mitzaehlt. In `needs` stehen ALLE
  # Jobs dieser Datei ausser ci und dependabot. Einzige Ausnahme: ein Job, der
  # bewusst nicht blockieren soll (z.B. ein noch flakiger E2E-Job), mit Grund.
  ci:
    name: ci
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Ein Job ist rot oder abgebrochen
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Alle Jobs gruen."

  # Zentrale Dependabot-Automatik, startet nur bei gruenem ci.
  dependabot:
    needs: ci
    # Pflicht. Ohne diese Zeile gilt das implizite success(), und das prueft
    # alle Vorgaenger-Jobs: ist einer davon uebersprungen (Matrix ohne Treffer,
    # bedingter Job), wird dependabot trotz gruenem ci uebersprungen.
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    uses: supsign/.github/.github/workflows/dependabot.yml@main
    permissions:
      contents: write
      pull-requests: write
    # Nur bei Bedarf, jeweils mit Grund im Kommentar:
    # with:
    #   max-update: patch     # Tests reichen fuer minor nachweislich nicht
    #   merge-method: merge   # Repo erlaubt kein squash
